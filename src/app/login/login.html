<!-- Create the main Bootstrap container for the login page. -->
<div class="container">

  <!-- Display the Login heading. -->
  <h2>Login</h2>

  <!-- Create the login form and call the login() function when submitted. -->
  <form (ngSubmit)="login()">

    <!-- Create a section for the email input. -->
    <div class="mb-3">

      <!-- Label for the email field. -->
      <label class="form-label">Email</label>

      <!-- Input where the user enters their email address. -->
      <input
        type="email"
        class="form-control"
        [(ngModel)]="loginModel.email"
        name="email"
        required>

    </div>

    <!-- Create a section for the password input. -->
    <div class="mb-3">

      <!-- Label for the password field. -->
      <label class="form-label">Password</label>

      <!-- Input where the user enters their password. -->
      <input
        type="password"
        class="form-control"
        [(ngModel)]="loginModel.password"
        name="password"
        required>

    </div>

    <!-- Create the button used to submit the login form. -->
    <button
      class="btn btn-primary"
      type="submit">

      <!-- Text displayed on the login button. -->
      Login

    </button>

  </form>

  <!-- Only display the error message if errorMessage contains something. -->
  <div
    class="alert alert-danger mt-3"
    *ngIf="errorMessage">

    <!-- Display the error message stored in the component. -->
    {{ errorMessage }}

  </div>

</div>
