<h1>Add Product</h1>

<form (ngSubmit)="save()">
  <label>
    ID
    <input
      name="id"
      type="number"
      [(ngModel)]="product.id"
      required
    />
  </label>

  <br />

  <label>
    Name
    <input
      name="name"
      maxlength="50"
      [(ngModel)]="product.name"
      required
    />
  </label>

  <br />

  <label>
    Description
    <input
      name="description"
      maxlength="255"
      [(ngModel)]="product.description"
      required
    />
  </label>

  <br />

  <label>
    Price
    <input
      name="price"
      type="number"
      step="0.01"
      [(ngModel)]="product.price"
      required
    />
  </label>

  <br />

  <label>
    Units
    <input
      name="units"
      type="number"
      [(ngModel)]="product.units"
      required
    />
  </label>

  <br />

  <label>
    Type
    <input
      name="type"
      [(ngModel)]="product.type"
    />
  </label>

  <br />

  <button type="submit">Add</button>
</form>
