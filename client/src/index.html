<!doctype html>
<html lang="en">

<head>
  <!-- Specifies the character encoding used by the page -->
  <meta charset="utf-8">

  <!-- Title displayed in the browser tab -->
  <title>Client</title>

  <!--
    Sets the base URL for Angular routing.
    This allows routerLink paths to work correctly.
  -->
  <base href="/">

  <!--
    Makes the application responsive on different screen sizes, especially mobile devices.
  -->
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <!-- Browser tab icon (favicon) -->
  <link
    rel="icon"
    type="image/x-icon"
    href="favicon.ico"
  >
</head>

<body>

  <!--
    Root component of the Angular application.
    Angular loads the application's content inside this element.
  -->
  <app-root></app-root>

</body>

</html>
